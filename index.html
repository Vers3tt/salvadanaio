<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Keepo</title>
<meta name="description" content="Entrate, uscite e obiettivi di risparmio.">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080D1A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Keepo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Direction: "libretto" — a calm ledger. Monochrome ink on a neutral grey, one bank-note green
   for money coming in and for progress; red only for a negative balance. Native SF Pro for UI,
   amounts set like shelf price tags (cents small and raised). Line icons, no emoji, no badges. */
:root{
  /* Brand: blu notte dell'icona su bianco freddo. Il testo e i pulsanti principali sono blu notte,
     il verde resta solo per i soldi che entrano, il rosso solo per il saldo negativo. */
  --bg:#F3F5F9; --card:#FFFFFF; --fill:#E9EDF4; --fill2:#F5F7FB;
  --line:rgba(16,28,60,.09); --ink:#111C38; --ink2:#5E6984; --ink3:#A4ACBF;
  --navy:#162448; --navy-2:#26386A; --rim:#46609C;
  --green:#18795C; --green-soft:#E1F1EB; --neg:#C0362C; --neg-soft:#F9E3E1;
  --on-ink:#FFFFFF; --bar:rgba(243,245,249,.86); --scrim:rgba(8,14,30,.34); --tile:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080D1A; --card:#121A2E; --fill:#1C2640; --fill2:#172036;
  --line:rgba(200,215,255,.09); --ink:#EDF1FA; --ink2:#97A2BC; --ink3:#56617C;
  --navy:#162448; --navy-2:#26386A; --rim:#5B78BE;
  --green:#5CCBA3; --green-soft:rgba(92,203,163,.14); --neg:#F2786D; --neg-soft:rgba(242,120,109,.14);
  --on-ink:#0B1226; --bar:rgba(8,13,26,.86); --scrim:rgba(0,0,0,.55); --tile:#F4F6FA; color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.38;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input{border:0;outline:none;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.i{display:block;flex:none}
[hidden]{display:none!important}

.screen{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 104px)}
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.nav small{display:block;color:var(--ink2);font-size:14px;font-weight:500;margin-bottom:2px}
.nav h1{font-family:var(--font-d);font-size:32px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.nav-btn{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.status{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13.5px;margin:-8px 2px 14px}

.card{background:var(--card);border-radius:var(--r)}
.section{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.sec-h h2{font-family:var(--font-d);font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0}
.link{color:var(--ink2);font-size:15px;font-weight:500}

/* price tag numbers */
.cents{font-size:.5em;vertical-align:.72em;margin-left:.04em;letter-spacing:0}
.cents.ghost{color:var(--ink3)}
.cur{font-size:.42em;vertical-align:.86em;margin-left:.22em;color:var(--ink2);font-weight:500;letter-spacing:0}

/* balance */
.balance{padding:20px 20px 16px}
.balance .lbl{display:block;color:var(--ink2);font-size:14px;font-weight:500}
.balance .big{display:block;font-family:var(--font-d);font-size:58px;font-weight:700;letter-spacing:-.045em;line-height:1;margin:8px 0 12px}
.balance .big.neg{color:var(--neg)}
.next{margin:0;color:var(--ink2);font-size:14.5px}
.next b{color:var(--ink);font-weight:600}
.spark{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.spark svg{display:block;width:100%;height:48px}
.spark-x{display:flex;justify-content:space-between;color:var(--ink3);font-size:12px;margin-top:6px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.act{border-radius:var(--r);padding:15px 14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16.5px;font-weight:600;transition:transform .12s,opacity .12s}
.act:active{transform:scale(.98);opacity:.85}
.act.out{background:var(--ink);color:var(--on-ink)}
.act.in{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.month{display:grid;grid-template-columns:repeat(3,1fr)}
.month div{padding:14px;display:grid;gap:4px;min-width:0}
.month div+div{border-left:1px solid var(--line)}
.month span{font-size:13px;color:var(--ink2)}
.month b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--green)} .neg{color:var(--neg)}

/* lists */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;width:100%;text-align:left;min-height:62px;position:relative}
.row:active{background:var(--fill2)}
.row+.row::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:1px solid var(--line)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--fill);color:var(--ink);display:grid;place-items:center;flex:none;overflow:hidden}
.ico.thumb{background:var(--tile)}
.ico.thumb img{width:100%;height:100%;object-fit:contain;padding:3px}
.row .t{flex:1;min-width:0;padding:11px 0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:600;white-space:nowrap}
.row .a.in{color:var(--green)}
.group-h{display:flex;justify-content:space-between;margin:24px 4px 8px;color:var(--ink2);font-size:13.5px;font-weight:500}
.group-h:first-child{margin-top:6px}
.group-h span:first-child::first-letter{text-transform:uppercase}
.empty{padding:30px 22px;text-align:center;color:var(--ink2);display:grid;gap:6px;justify-items:center;font-size:15px}
.empty b{color:var(--ink);font-size:17px;font-weight:600}
.empty-ico{width:48px;height:48px;border-radius:14px;background:var(--fill);color:var(--ink);display:grid;place-items:center;margin-bottom:6px}
.empty .save{margin-top:10px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:3px;margin:0 0 14px}
.seg button{padding:7px 8px;border-radius:8px;font-size:14.5px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* goals */
.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.goal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.goal-strip{display:grid;grid-auto-flow:column;grid-auto-columns:152px;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.goal-strip::-webkit-scrollbar{display:none}
.gcard{background:var(--card);border-radius:var(--r);padding:8px 8px 12px;display:grid;gap:8px;text-align:left;scroll-snap-align:start;transition:transform .12s;min-width:0;align-content:start}
.gcard:active{transform:scale(.98)}
.gimg{aspect-ratio:1;border-radius:10px;background:var(--tile);display:grid;place-items:center;overflow:hidden;max-width:100%}
.gimg:not(:has(img)){background:var(--fill)}
.gimg img{width:100%;height:100%;object-fit:contain;padding:9%}
.gimg .ph{color:var(--ink3)}
.gcard b{font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 4px;min-height:2.5em}
.prog{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:0 4px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gcard.ok .prog i,.dprog.ok .prog i{background:var(--green)}
.gmeta{display:flex;justify-content:space-between;gap:6px;padding:0 4px;font-size:13px;color:var(--ink2);white-space:nowrap}
.gmeta span:first-child{color:var(--ink);font-weight:600}
.gcard.ok .gmeta span:first-child{color:var(--green)}
.gadd{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink2);display:grid;place-items:center;align-content:center;gap:6px;font-weight:500;font-size:15px;min-height:160px}

/* settings */
.cell{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;min-height:50px;width:100%;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.cell span:last-child:not(:first-child){color:var(--ink2);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.btn{font-weight:500} .cell.danger{color:var(--neg);font-weight:500}
.foot{color:var(--ink2);font-size:13px;margin:8px 4px 0;line-height:1.45}
.hint{color:var(--ink2);font-size:13.5px;margin:12px 4px 0;line-height:1.45}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);backdrop-filter:saturate(160%) blur(20px);-webkit-backdrop-filter:saturate(160%) blur(20px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 4px);display:flex;justify-content:center}
.tabbar nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.tabbar nav button{display:grid;justify-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:500;padding:2px 0}
.tabbar nav button[aria-current="page"]{color:var(--ink)}
.tabbar nav button[aria-current="page"] .i{stroke-width:2.1}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .3s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:16px;animation:pop .22s ease}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);opacity:.6;margin:0 auto 6px}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:8px}
.sheet-h h3{margin:0;font-size:17px;font-weight:600;text-align:center}
.sheet-h .l{justify-self:start;color:var(--ink2);font-size:16.5px}
.sheet-h .r{justify-self:end;color:var(--ink);font-size:16.5px;font-weight:600}
.sheet-h .r:disabled{color:var(--ink3)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translateY(-46%)}}
@keyframes fade{from{opacity:0}}

.amount{text-align:center;padding:18px 0 10px}
.amount .v{font-family:var(--font-d);font-size:60px;font-weight:700;letter-spacing:-.045em;line-height:1;word-break:break-all}
.amount .v.in{color:var(--green)}
.cats{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--ink2);min-width:64px}
.cat .ico{width:48px;height:48px;border-radius:14px;background:var(--card);transition:background .12s,color .12s}
.cat[aria-pressed="true"]{color:var(--ink);font-weight:600}
.cat[aria-pressed="true"] .ico{background:var(--ink);color:var(--on-ink)}
.field{background:var(--card);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 14px;min-height:48px}
.field input{flex:1;min-width:0;padding:12px 0}
.field input::placeholder{color:var(--ink3)}
.field label{color:var(--ink2);font-size:15px;white-space:nowrap}
.fields{display:grid;gap:8px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keypad button{background:var(--card);border-radius:12px;height:54px;font-size:24px;font-weight:450;font-family:var(--font-d);transition:background .08s}
.keypad button:active{background:var(--fill)}
.save{width:100%;background:var(--ink);color:var(--on-ink);border-radius:var(--r);padding:16px;font-size:16.5px;font-weight:600;margin-top:12px}
.save.in{background:var(--green);color:var(--on-ink)}
.save:disabled{opacity:.35}
.save.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.save.danger{background:transparent;color:var(--neg);font-weight:500}
.save.small{width:auto;padding:11px 20px;font-size:15px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow .save{margin-top:0}

.pick{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border-radius:12px;padding:12px}
.pick .gimg{width:110px}
.pick-btns{display:grid;gap:6px}
.pill{display:flex;align-items:center;gap:9px;background:var(--fill2);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink);text-decoration:none}
.pastezone{font-size:13px;color:var(--ink2);border:1px dashed var(--ink3);border-radius:10px;padding:9px 11px;min-height:38px;outline:none;margin-top:8px}
.pastezone:focus{border-color:var(--ink)}
.pastezone:empty::before{content:attr(data-ph)}

.detail-img{width:min(220px,60%);margin:4px auto 14px;border-radius:18px}
.detail h2{text-align:center;margin:0;font-family:var(--font-d);font-size:24px;font-weight:700;letter-spacing:-.02em}
.detail .sub{text-align:center;color:var(--ink2);margin:2px 0 16px}
.dprog{display:grid;gap:8px;margin:0 0 14px}
.dprog>span{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:-.03em;text-align:center}
.dprog.ok>span{color:var(--green)}
.dprog .prog{height:6px;border-radius:3px;margin:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:12px;margin-bottom:10px}
.stats3 div{padding:12px;display:grid;gap:3px;text-align:center;min-width:0}
.stats3 div+div{border-left:1px solid var(--line)}
.stats3 span{font-size:12.5px;color:var(--ink2)}
.stats3 b{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta{color:var(--ink2);font-size:14.5px;margin:0 0 14px;text-align:center}
.confirm{background:var(--card);border-radius:12px;padding:14px;display:grid;gap:10px;margin-top:10px}
.confirm p{margin:0;font-size:15px}

/* auth / setup */
.auth{min-height:100vh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.auth .box{width:100%;max-width:380px;display:grid;gap:12px}
.auth h1{text-align:center;margin:0;font-family:var(--font-d);font-size:28px;letter-spacing:-.025em}
.auth p{text-align:center;color:var(--ink2);margin:0 0 6px}
.auth .err{color:var(--neg);font-size:14px;text-align:center;min-height:1em}
.auth .err.ok{color:var(--green);background:var(--green-soft);border-radius:10px;padding:10px 12px}
.auth .err:empty{padding:0;background:none}
.auth .alt{color:var(--ink);text-align:center;font-size:15px;font-weight:500;padding:6px}
.steps .cell{font-size:14.5px;align-items:flex-start}
.steps .cell span:first-child{color:var(--ink);white-space:normal;text-align:left;overflow:visible}
.steps a{color:var(--ink)}
.steps .link{font-size:14.5px;font-weight:600;white-space:nowrap;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:30;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:14px;font-size:15px;width:max-content;max-width:calc(100% - 32px);animation:tin .2s ease}
.toast button{color:var(--on-ink);font-weight:600;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}
/* balance chart */
.bal-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ranges{display:flex;background:var(--fill);border-radius:8px;padding:2px}
.ranges button{font-size:12.5px;font-weight:600;color:var(--ink2);padding:4px 9px;border-radius:6px}
.ranges button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.balance .big{margin-bottom:6px}
.delta{margin:0 0 4px;color:var(--ink2);font-size:14px}
.delta b{font-weight:600}
.bchart{margin:18px 0 14px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.bchart-plot{position:relative;height:120px;margin-right:0}
.bchart-plot svg{display:block;width:100%;height:100%;overflow:visible}
.bdot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--card);transform:translate(-50%,-50%);pointer-events:none}
.bcross{position:absolute;top:0;bottom:0;width:1px;background:var(--ink3);pointer-events:none}
.btip{position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--ink);color:var(--on-ink);border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap;display:grid;gap:1px;text-align:center;pointer-events:none}
.btip b{font-size:14px;font-weight:600}
.ylab{position:absolute;right:0;font-size:11px;color:var(--ink3);background:var(--card);padding-left:4px;line-height:1}
.ylab.top{top:-14px}.ylab.bot{bottom:-14px}
.bchart-x{display:flex;justify-content:space-between;color:var(--ink3);font-size:11.5px;margin-top:18px}
.next{padding-top:12px;border-top:1px solid var(--line)}

/* monthly bars */
.monthly{padding:16px 16px 0}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.in{background:var(--green)} .sw.out{background:var(--ink)}
.mplot{position:relative;height:150px}
.mgrid{position:absolute;inset:0 0 22px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.mgrid span{border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3);text-align:right;line-height:1;padding-top:3px}
.mgrid span:last-child{border-top-color:var(--ink3);opacity:.6}
.mbars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-right:44px}
.mgroup{display:grid;grid-template-rows:1fr 22px;align-items:end;border-radius:8px;padding:0 2px}
.mgroup .bars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.mgroup .bars i{display:block;width:min(14px,40%);border-radius:4px 4px 0 0;min-height:0;transition:height .4s cubic-bezier(.2,.8,.2,1)}
.mgroup .bin{background:var(--green)} .mgroup .bout{background:var(--ink)}
.mgroup:not(.sel) .bars i{opacity:.32}
.mlab{font-size:11.5px;color:var(--ink3);text-align:center;align-self:center}
.mgroup.sel .mlab{color:var(--ink);font-weight:600}
.msum{display:grid;grid-template-columns:repeat(3,1fr);margin:14px -16px 0;border-top:1px solid var(--line)}
.msum div{padding:12px 12px;display:grid;gap:3px;min-width:0}
.msum div+div{border-left:1px solid var(--line)}
.msum span{font-size:12.5px;color:var(--ink2)}
.msum b{font-size:clamp(13px,3.9vw,15.5px);font-weight:600;white-space:nowrap}
.sec-sub{color:var(--ink2);font-size:14px}

/* category breakdown */
.crow{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.crow+.crow::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:1px solid var(--line)}
.cmain{flex:1;min-width:0;display:grid;gap:6px}
.ctop{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.ctop b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctop span{font-weight:600;white-space:nowrap}
.cbar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.cpct{width:36px;text-align:right;font-size:13px;color:var(--ink2);flex:none}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 12px;margin-bottom:10px;color:var(--ink2)}
.search input{flex:1;min-width:0;padding:10px 0;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink3)}
.search input::-webkit-search-cancel-button{opacity:.5}

/* goals: link + date */
.field>.i{color:var(--ink2)}
.gdate{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);padding:0 4px;margin-top:-2px}
.plan{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:0 0 12px;text-align:left}
.plan .i{color:var(--ink2);margin-top:1px}
.linkbtn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
/* logo + splash */
.logo-svg{display:block}
.auth .logo{width:84px;height:84px;margin:0 auto 6px;border-radius:0}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease .05s}
#splash.out{opacity:0;pointer-events:none}
#splash .stage{display:grid;justify-items:center;gap:22px}
#splash svg{width:148px;height:148px;overflow:visible}
#splash .back1,#splash .back2{opacity:0;transform-box:fill-box;transform-origin:center}
#splash .back2{animation:slideIn .5s cubic-bezier(.2,.9,.3,1) .08s forwards}
#splash .back1{animation:slideIn .5s cubic-bezier(.2,.9,.3,1) .2s forwards}
#splash .front{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:drop .7s cubic-bezier(.3,1.4,.5,1) .32s forwards}
#splash .nostrils{transform-box:fill-box;transform-origin:center;animation:blink .32s ease 1.15s}
#splash .name{font-family:var(--font-d);font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--ink);opacity:0;transform:translateY(8px);animation:rise .5s ease .75s forwards}
.nav-logo{flex:none;margin-bottom:2px}
.nav-logo .logo{width:46px;height:46px;margin:0}
.about{display:grid;justify-items:center;gap:4px;margin:34px 0 8px;color:var(--ink2);font-size:13.5px;text-align:center}
.about .logo{width:56px;height:56px;margin:0 0 6px}
.about b{color:var(--ink);font-size:16px}
/* mascotte */
.nav{position:relative}
.nav-r{display:flex;align-items:center;gap:10px}
.mascot{width:50px;height:66px;flex:none;margin:0 -4px -2px 0;-webkit-touch-callout:none}
.mascot svg{width:100%;height:100%;overflow:visible;display:block}
.mascot .m-float{animation:mFloat 3.4s ease-in-out infinite}
.mascot .m-shadow{transform-box:fill-box;transform-origin:center;animation:mShadow 3.4s ease-in-out infinite}
.mascot .m-react,.mascot .m-nos{transform-box:fill-box;transform-origin:center}
.mascot .m-nos{animation:mBlink 5.2s ease-in-out infinite}
.mascot.jump .m-react{animation:mJump .75s cubic-bezier(.3,1.5,.5,1)}
.mascot.squish .m-react{transform-origin:50% 100%;animation:mSquish .7s ease}
.mascot.wiggle .m-react{animation:mWiggle .8s ease}
@keyframes mFloat{50%{transform:translateY(-4px)}}
@keyframes mShadow{50%{transform:scaleX(.82);opacity:.08}}
@keyframes mBlink{0%,90%,100%{transform:none}93%{transform:scaleY(.12)}96%{transform:none}}
@keyframes mJump{0%{transform:none}35%{transform:translateY(-16px) scale(1.06,.96)}60%{transform:translateY(0) scale(1.08,.9)}80%{transform:scale(.97,1.04)}100%{transform:none}}
@keyframes mSquish{30%{transform:scale(1.14,.78)}60%{transform:scale(.95,1.05)}100%{transform:none}}
@keyframes mWiggle{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
.m-bubble{position:absolute;right:-2px;top:calc(100% + 6px);z-index:6;width:max-content;max-width:min(270px,calc(100vw - 32px));display:grid;gap:6px;background:var(--navy);color:#fff;font-size:14.5px;line-height:1.4;padding:11px 14px 10px;border-radius:16px;box-shadow:0 12px 28px -12px rgba(10,20,50,.55);animation:bIn .25s cubic-bezier(.2,.9,.3,1.2);transition:opacity .35s,transform .35s;cursor:pointer;text-align:left}
.m-bubble::before{content:"";position:absolute;top:-6px;right:20px;width:14px;height:14px;background:inherit;border-radius:3px;transform:rotate(45deg)}
.m-bubble .mb-text{position:relative}
.m-bubble .mb-more{position:relative;font-size:11.5px;opacity:.65;letter-spacing:.01em}
.m-bubble.out{opacity:0;transform:translateY(-4px)}
@keyframes bIn{from{opacity:0;transform:translateY(-6px) scale(.96)}}
@media (prefers-color-scheme:dark){.mascot svg{filter:drop-shadow(0 0 0 transparent)}.mascot .m-react>circle:first-child{stroke:#F4F6FA;stroke-width:2.5}.m-bubble{background:#F4F6FA;color:var(--navy)}}
@media (prefers-reduced-motion:reduce){.mascot .m-float,.mascot .m-shadow,.mascot .m-nos{animation:none}}
/* budget, ricorrenti, onboarding, account */
:root{--warn:#B26B00}
@media (prefers-color-scheme:dark){:root{--warn:#F2B341}}
.sec-note{margin:-6px 2px 10px;color:var(--ink2);font-size:13.5px}
button.crow{width:100%;text-align:left}
.crow.warn .cbar i{background:var(--warn)} .crow.over .cbar i{background:var(--neg)}
.crow.warn .cpct{color:var(--warn);font-weight:600} .crow.over .cpct{color:var(--neg);font-weight:600}
.csub{font-size:12.5px;color:var(--ink2)} .crow.over .csub{color:var(--neg)}
.field select{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);text-align:right;text-align-last:right;padding:12px 0;-webkit-appearance:none;appearance:none}
.terms{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);text-align:left;line-height:1.4}
.terms input{width:18px;height:18px;margin-top:1px;flex:none;accent-color:var(--navy)}
.terms a,.legal a{color:var(--ink)}
.legal{font-size:12.5px;color:var(--ink2);text-align:center;margin:10px 0 0}

.rrow{flex-wrap:wrap;padding-bottom:10px}

.onboarding .box{text-align:center;gap:14px}

.ob-hero{position:relative;display:grid;place-items:center;margin-bottom:6px}
.ob-hero .mascot{width:120px;height:158px;margin:0}
.ob-hero .m-bubble{top:auto;bottom:calc(100% + 4px);right:50%;transform:translateX(50%)}

.ob-amt{max-width:240px;margin:6px auto 4px;justify-content:center}
.ob-amt input{font-family:var(--font-d);font-size:30px;font-weight:700;text-align:center;letter-spacing:-.02em}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.dots i.on{background:var(--ink);width:18px;border-radius:4px}
.logo-tile{fill:transparent}
@media (prefers-color-scheme:dark){.logo-tile{fill:var(--tile)}}
/* ===== sidebar elements (hidden on phone) ===== */
.side-brand,.side-actions,.side-foot{display:none}
.mov-sum{display:none}
.home-grid,.col-a,.col-b{display:contents}
.col-b .section.first{margin-top:30px}

@media (hover:hover){
  .row:hover,.cell.btn:hover,button.crow:hover{background:var(--fill2)}
  .gcard:hover{box-shadow:0 0 0 1px var(--line),0 8px 20px -14px rgba(16,28,60,.35)}
  .act:hover,.save:hover,.nav-btn:hover{filter:brightness(1.08)}

}

/* ===== desktop ===== */

  body{font-size:15.5px}
  .tabbar{top:0;right:auto;bottom:0;left:0;width:248px;flex-direction:column;justify-content:flex-start;gap:6px;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 14px 18px;border-top:0;border-right:1px solid var(--line);background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
  .side-brand{display:flex;align-items:center;gap:8px;padding:0 8px 18px;position:relative}

  .side-foot{display:grid;gap:6px;margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}

  .screen{max-width:1180px;margin:0 0 0 248px;padding:calc(env(safe-area-inset-top,0px) + 34px) 40px 48px}

  .home-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
