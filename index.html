<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Salvadanaio</title>
<meta name="description" content="Entrate, uscite e obiettivi di risparmio.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Salvadanaio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: iOS-style single column — large title, grouped inset cards, translucent tab bar at the bottom */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#E9E9EE; --fill2:#F2F2F7;
  --sep:rgba(60,60,67,.16); --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --tint:#5E5CE6; --tint-soft:rgba(94,92,230,.12);
  --green:#28A745; --green-soft:rgba(52,199,89,.14); --red:#FF3B30; --red-soft:rgba(255,59,48,.12);
  --bar:rgba(249,249,251,.82); --scrim:rgba(0,0,0,.32); --tile:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --fill2:#232325;
  --sep:rgba(84,84,88,.55); --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --tint:#7D7AFF; --tint-soft:rgba(125,122,255,.18);
  --green:#30D158; --green-soft:rgba(48,209,88,.16); --red:#FF453A; --red-soft:rgba(255,69,58,.16);
  --bar:rgba(22,22,24,.82); --scrim:rgba(0,0,0,.55); --tile:#FFFFFF; color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input{border:0;outline:none;background:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.screen{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 100px)}
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 4px 14px}
.nav small{display:block;color:var(--label2);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.nav h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0;line-height:1.1}
.nav-btn{width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--tint);display:grid;place-items:center;flex:none}
.nav-btn svg{width:20px;height:20px}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.sync-dot.wait{background:#FF9F0A}.sync-dot.off{background:var(--label3)}

.card{background:var(--card);border-radius:var(--r)}
.section{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.sec-h h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.link{color:var(--tint);font-size:16px}

/* balance */
.balance{padding:18px 18px 14px;display:grid;gap:4px;overflow:hidden}
.balance .lbl{color:var(--label2);font-size:15px;font-weight:500}
.balance .big{font-family:var(--font-round);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.balance .big.neg{color:var(--red)}
.balance .split{display:flex;gap:16px;flex-wrap:wrap;color:var(--label2);font-size:14px;margin-top:2px}
.balance .split b{color:var(--label);font-weight:600}
.spark{height:56px;margin:10px -18px -14px}
.spark svg{display:block;width:100%;height:100%}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.act{background:var(--card);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;transition:transform .12s}
.act:active{transform:scale(.97)}
.act i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:600;line-height:1}
.act.out i{background:var(--red-soft);color:var(--red)} .act.in i{background:var(--green-soft);color:var(--green)}

.month{display:grid;grid-template-columns:repeat(3,1fr)}
.month div{padding:14px 12px;display:grid;gap:2px;min-width:0}
.month div+div{border-left:.5px solid var(--sep)}
.month span{font-size:13px;color:var(--label2)}
.month b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--green)} .neg{color:var(--red)}

/* list */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;width:100%;text-align:left;min-height:60px;position:relative}
.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:.5px solid var(--sep)}
.ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.row .t{flex:1;min-width:0;padding:10px 0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--label2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:600;white-space:nowrap}
.row .a.in{color:var(--green)}
.group-h{display:flex;justify-content:space-between;margin:22px 16px 6px;color:var(--label2);font-size:13px;text-transform:uppercase;letter-spacing:.02em}
.group-h:first-child{margin-top:6px}
.empty{padding:32px 20px;text-align:center;color:var(--label2);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--label);font-size:17px}
.empty .emoji{font-size:40px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 12px}
.seg button{padding:6px 8px;border-radius:7px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{background:#636366}}

/* goals */
.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.goal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.goal-strip{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.goal-strip::-webkit-scrollbar{display:none}
.gcard{background:var(--card);border-radius:var(--r);padding:10px;display:grid;gap:8px;text-align:left;scroll-snap-align:start;transition:transform .12s;min-width:0}
.gcard:active{transform:scale(.97)}
.gimg{aspect-ratio:1;border-radius:12px;background:var(--tile);display:grid;place-items:center;overflow:hidden;position:relative;max-width:100%}
.gimg:not(:has(img)){background:var(--fill2)}
.nav .hint{white-space:nowrap;margin:0 0 6px;font-size:13px}
.gimg img{width:100%;height:100%;object-fit:contain;padding:8%}
.gimg .ph{font-size:38px;font-weight:700;color:#C7C7CC;font-family:var(--font-round)}
.gimg .pct{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:2px 7px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.gimg .pct.ok{background:var(--green)}
.gcard b{font-size:15px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 2px}
.gcard small{color:var(--label2);font-size:13px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--tint);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog.ok i{background:var(--green)}
.gadd{border:2px dashed var(--sep);background:transparent;display:grid;place-items:center;color:var(--tint);font-weight:600;min-height:150px}

/* settings */
.cell{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;min-height:48px;width:100%;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell span:last-child{color:var(--label2);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.btn{color:var(--tint)} .cell.danger{color:var(--red)}
.foot{color:var(--label2);font-size:13px;margin:8px 16px 0;line-height:1.4}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;justify-content:center}
.tabbar nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.tabbar button{display:grid;justify-items:center;gap:2px;color:var(--label3);font-size:10.5px;font-weight:500;padding:2px 0}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--tint)}
@media (prefers-color-scheme:dark){.tabbar button{color:rgba(235,235,245,.45)}}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .32s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:16px;animation:pop .25s ease}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 6px}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:8px}
.sheet-h h3{margin:0;font-size:17px;font-weight:600;text-align:center}
.sheet-h .l{justify-self:start;color:var(--tint);font-size:17px}
.sheet-h .r{justify-self:end;color:var(--tint);font-size:17px;font-weight:600}
.sheet-h .r:disabled{color:var(--label3)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translateY(-46%)}}
@keyframes fade{from{opacity:0}}

.amount{text-align:center;padding:14px 0 6px}
.amount .v{font-family:var(--font-round);font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.1;word-break:break-all}
.amount .v.out{color:var(--label)} .amount .v.in{color:var(--green)}
.amount .v .c{color:var(--label3)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:8px -16px 10px;padding:0 16px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:grid;justify-items:center;gap:4px;font-size:11.5px;color:var(--label2);min-width:60px}
.cat .ico{width:46px;height:46px;font-size:22px;border:2px solid transparent;transition:transform .12s}
.cat[aria-pressed="true"]{color:var(--label);font-weight:600}
.cat[aria-pressed="true"] .ico{border-color:var(--tint);transform:scale(1.06)}
.field{background:var(--card);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 14px;min-height:46px}
.field input{flex:1;min-width:0;padding:12px 0}
.field label{color:var(--label2);font-size:15px;white-space:nowrap}
.fields{display:grid;gap:8px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keypad button{background:var(--card);border-radius:12px;height:52px;font-size:25px;font-weight:500;font-family:var(--font-round);transition:background .08s}
.keypad button:active{background:var(--fill)}
.save{width:100%;background:var(--tint);color:#fff;border-radius:14px;padding:15px;font-size:17px;font-weight:600;margin-top:12px}
.save.in{background:var(--green)} .save.out{background:var(--red)}
.save:disabled{opacity:.4}
.save.ghost{background:var(--card);color:var(--tint)}
.save.danger{background:var(--card);color:var(--red)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow .save{margin-top:0}

.pick{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border-radius:12px;padding:12px}
.pick .gimg{width:110px;border:.5px solid var(--sep)}
.pick-btns{display:grid;gap:6px}
.pill{display:flex;align-items:center;gap:8px;background:var(--fill2);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:500;color:var(--tint);text-decoration:none}
.pill svg{width:18px;height:18px;flex:none}
.pastezone{font-size:12.5px;color:var(--label2);border:1px dashed var(--sep);border-radius:10px;padding:8px 10px;min-height:36px;outline:none}
.pastezone:focus{border-color:var(--tint)}
.pastezone:empty::before{content:attr(data-ph)}
.hint{color:var(--label2);font-size:13px;margin:6px 4px 0}

.detail-img{width:min(220px,60%);margin:4px auto 10px;border-radius:22px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35)}
.detail h2{text-align:center;margin:0;font-size:24px;letter-spacing:-.01em}
.detail .sub{text-align:center;color:var(--label2);margin:2px 0 14px}
.ring{display:grid;place-items:center;margin:4px 0 12px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:12px;margin-bottom:12px}
.stats3 div{padding:12px;display:grid;gap:2px;text-align:center;min-width:0}
.stats3 div+div{border-left:.5px solid var(--sep)}
.stats3 span{font-size:12.5px;color:var(--label2)}
.stats3 b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta{background:var(--tint-soft);color:var(--tint);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:500;margin-bottom:12px;text-align:center}
.confirm{background:var(--red-soft);border-radius:12px;padding:12px;display:grid;gap:10px;margin-top:10px}
.confirm p{margin:0;font-size:15px}

/* auth / setup */
.auth{min-height:100vh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.auth .box{width:100%;max-width:380px;display:grid;gap:12px}
.auth .logo{width:84px;height:84px;border-radius:20px;margin:0 auto 6px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
.auth h1{text-align:center;margin:0;font-size:28px;letter-spacing:-.02em}
.auth p{text-align:center;color:var(--label2);margin:0 0 6px}
.auth .err{color:var(--red);font-size:14px;text-align:center;min-height:1em}
.auth .alt{color:var(--tint);text-align:center;font-size:15px;padding:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);z-index:30;background:rgba(30,30,32,.94);color:#fff;border-radius:14px;padding:11px 12px 11px 16px;display:flex;align-items:center;gap:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px -8px rgba(0,0,0,.4);animation:tin .25s ease;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.toast button{color:#A5A3FF;font-weight:600;padding:2px 4px}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toastRoot"></div>
<canvas id="confetti" hidden></canvas>
<input type="file" id="fileIn" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
